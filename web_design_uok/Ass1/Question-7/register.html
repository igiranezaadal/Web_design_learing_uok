<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huye Charity Run - Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container">
    <header class="intro">
      <h1>Huye Charity Run 2026</h1>
      <p>Join us in Huye for a day of community, health, and charitable giving. Please fill in the registration form below to secure your spot in the run!</p>
    </header>

    <!-- 
      A.  POST vs GET:
      POST is used instead of GET for this registration form for two main reasons:
      1. Security/Privacy: GET attaches form data directly to the URL parameters, which exposes personal details (such as e-mail, phone number, and medical conditions) in the browser history, server logs, and shared links. POST sends data inside the HTTP request body, keeping personal data private.
      2. Data Payload: POST supports larger and more complex payloads (such as medical condition notes) without hitting URL length restrictions imposed by web browsers and servers.
    -->
    <form action="#" method="POST" class="registration-form" novalidate>
      
      <fieldset>
        <legend>Your details</legend>
        
        <div class="field-group full-width">
          <label for="fullname">Full Name <span class="required-star">*</span></label>
          <input type="text" id="fullname" name="fullname" required placeholder="e.g. Jean De Dieu Kwizera">
        </div>

        <div class="field-group">
          <label for="email">E-mail Address <span class="required-star">*</span></label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="field-group">
          <label for="phone">Phone Number (10 digits) <span class="required-star">*</span></label>
          <input type="tel" id="phone" name="phone" required pattern="^[0-9]{10}$" placeholder="0788000000" title="Please enter exactly 10 digits">
        </div>

        <div class="field-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob">
        </div>

        <div class="field-group">
          <label for="age">Age (Min 16)</label>
          <input type="number" id="age" name="age" min="16" placeholder="16+">
        </div>

        <div class="field-group full-width">
          <label for="district">District</label>
          <input type="text" id="district" name="district" list="districts-list" placeholder="Select or type your district">
          <datalist id="districts-list">
            <option value="Huye"></option>
            <option value="Nyarugenge"></option>
            <option value="Gasabo"></option>
            <option value="Kicukiro"></option>
            <option value="Gisagara"></option>
            <option value="Nyamagabe"></option>
            <option value="Rubavu"></option>
          </datalist>
        </div>
      </fieldset>

      <fieldset>
        <legend>Your race</legend>

        <div class="field-group full-width">
          <span class="group-label">Category <span class="required-star">*</span></span>
          <div class="radio-pill-group">
            <label class="radio-pill">
              <input type="radio" name="category" value="10km" required>
              <span>10 km run</span>
            </label>
            <label class="radio-pill">
              <input type="radio" name="category" value="5km" required>
              <span>5 km walk</span>
            </label>
          </div>
        </div>

        <div class="field-group">
          <label for="tshirt">T-shirt Size</label>
          <select id="tshirt" name="tshirt">
            <option value="" disabled selected>Choose size</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
          </select>
        </div>

        <div class="field-group full-width">
          <label for="medical">Medical Conditions (if any)</label>
          <textarea id="medical" name="medical" rows="3" placeholder="Specify any allergies, injuries, or conditions..."></textarea>
        </div>
      </fieldset>

      <div class="field-group checkbox-group full-width">
        <label class="checkbox-label">
          <input type="checkbox" id="rules" name="rules" required>
          <span>I agree to the race rules and safety regulations <span class="required-star">*</span></span>
        </label>
      </div>

      <button type="submit" class="submit-btn">Complete Registration</button>

    </form>
  </main>

</body>
</html>
