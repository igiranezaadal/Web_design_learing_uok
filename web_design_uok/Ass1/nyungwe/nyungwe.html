<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyungwe Visitor Centre</title>
  <!-- Replace favicon.ico with exact icon filename from q03 folder if different -->
  <link rel="icon" href="images/park-icon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="hero">
    <h1>Nyungwe National Park</h1>
    <p>Discover the wonders of the ancient rainforest</p>
  </header>

  <main class="main-content">
    <figure class="hero-card">
      <img src="images/canopy-walk.jpg" alt="Canopy walk suspension bridge high above Nyungwe rainforest" width="700" height="400">
      <figcaption>Experience the breathtaking Canopy Walkway through Nyungwe's treetops.</figcaption>
    </figure>

    <div class="divider">
      <img src="images/leaf-divider.png" alt="" class="leaf-img">
    </div>

    <section>
      <h2>In the forest</h2>
      <div class="grid-container">
        <img src="images/rainforest.jpg" alt="Dense green tropical trees inside Nyungwe rainforest" width="400" height="260" loading="lazy">
        <img src="images/waterfall.jpg" alt="Sunlight filtering through canopy leaves in Nyungwe" width="400" height="260" loading="lazy">
      </div>
    </section>

    <section class="media-section grid-container">
      <div class="panel">
        <!-- REPLACE video/poster filenames with exact files from q03 -->
        <video controls poster="images/canopy-poster.jpg" width="100%">
          <source src="media/canopy-walk.mp4" type="video/mp4">
          Your browser does not support the video tag. <a href="media/canopy-walk.mp4">Download Canopy Walk Video</a>.
        </video>
      </div>

      <div class="panel">
        <p>More than 300 bird spicies live in Nyungwe. This is what you will hear in the morning</p>
        <!-- REPLACE audio filename with exact file from q03 -->
        <audio controls>
          <source src="media/bird-calls.mp3" type="audio/mpeg">
          Your browser does not support the audio element. <a href="media/bird-calls.mp3">Download Bird Calls Audio</a>.
        </audio>
      </div>
    </section>

    <section class="map-section">
      <h2>Uwinka Entrance Map</h2>
      <iframe 
        title="OpenStreetMap location of Uwinka Entrance in Nyungwe National Park"
        width="100%" 
        height="350" 
        src="https://www.openstreetmap.org/export/embed.html?bbox=29.1000%2C-2.5500%2C29.3000%2C-2.4000&amp;layer=mapnik">
      </iframe>
    </section>
  </main>

</body>
</html>
